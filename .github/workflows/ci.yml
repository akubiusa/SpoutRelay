name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:
  workflow_dispatch:

# Include event_name so cancellation is independent per event. Only pull_request runs are
# cancelled when superseded; a newer push to master must never cancel an in-flight tag/release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: 🏗️ Build & Test (Windows / MinGW64)
    runs-on: windows-latest
    # Runs PR-controlled code, so it only ever gets a read-only token
    permissions:
      contents: read

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: 🏗 Setup MSYS2 / MinGW64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config

      - name: 📥 Download FFmpeg LGPL shared build
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -UseBasicParsing
          $asset = $release.assets |
            Where-Object { $_.name -match '^ffmpeg-N-.*-win64-lgpl-shared\.zip$' } |
            Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets |
              Where-Object { $_.name -match 'win64-lgpl-shared\.zip$' } |
              Select-Object -First 1
          }
          if (-not $asset) { throw "No win64-lgpl-shared asset found in latest BtbN FFmpeg release" }
          $url = $asset.browser_download_url
          Write-Host "Downloading: $($asset.name)"
          $zip = "$env:TEMP\ffmpeg-lgpl.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\ffmpeg-lgpl" -Force
          $inner = (Get-ChildItem "$env:TEMP\ffmpeg-lgpl" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force deps\ffmpeg | Out-Null
          Copy-Item "$inner\*" deps\ffmpeg -Recurse -Force
          Write-Host "FFmpeg LGPL: $((& deps\ffmpeg\bin\ffmpeg.exe -version 2>&1)[0])"

      - name: 🔧 Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-mingw.cmake \
            -DBUILD_TESTS=ON
        env:
          MINGW_BIN: /mingw64/bin
          MINGW_ROOT: /mingw64/x86_64-w64-mingw32

      - name: 🏗️ Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: 🧪 Run unit tests
        shell: msys2 {0}
        run: ./build/tests/publisher_tests.exe

      - name: 📦 Package binary
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/spout-relay.exe dist/
          strip dist/spout-relay.exe
          # Bundle FFmpeg LGPL DLLs (only the 7 core FFmpeg DLLs — no GPL codecs)
          cp deps/ffmpeg/bin/*.dll dist/
          # Bundle MinGW winpthread runtime DLL.
          # The EXE is built with --whole-archive to attempt static embedding,
          # but libwinpthread-1.dll is always included to guarantee correct
          # startup on machines without the MinGW runtime installed.
          cp /mingw64/bin/libwinpthread-1.dll dist/
          # Include license notices required by redistributed third-party components
          cp THIRD_PARTY_LICENSES.md dist/
          echo "Packaged $(ls dist/ | wc -l) files (EXE + FFmpeg LGPL DLLs + MinGW runtime + THIRD_PARTY_LICENSES.md)"

      - name: 📦 Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spout-relay-win64
          path: dist/

  calc-version:
    name: 🔢 Calculate next version
    runs-on: ubuntu-latest
    # Tag only on trusted master pushes, and only after the build succeeded
    if: github.event_name == 'push'
    needs:
      - build
    permissions:
      contents: write

    outputs:
      tag: ${{ steps.tag-version.outputs.new_tag }}
      changelog: ${{ steps.tag-version.outputs.changelog }}

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🏷 Bump version and push tag
        id: tag-version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: "minor"
          custom_release_rules: "feat:minor:✨ Features,fix:patch:🐛 Fixes,docs:patch:📰 Docs,chore:patch:🎨 Chore,perf:patch:🎈 Performance improvements,refactor:patch:🧹 Refactoring,build:patch:🔍 Build,ci:patch:🔍 CI,revert:patch:⏪ Revert,style:patch:🧹 Style,test:patch:👀 Test,release:major:📦 Release"
          dry_run: false
          commit_sha: ${{ github.sha }}

  release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - build
      - calc-version
    permissions:
      contents: write

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📥 Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: spout-relay-win64
          path: dist

      - name: 📦 Package release archive
        id: package
        env:
          TAG: ${{ needs.calc-version.outputs.tag }}
        run: |
          ARCHIVE="spout-relay-${TAG}-win64.zip"
          # dist/ holds the stripped EXE and DLLs downloaded from the build job
          if [ -f config/config.example.json ]; then cp config/config.example.json dist/; fi
          if [ -f README.md ]; then cp README.md dist/; fi
          (cd dist && zip -r "../${ARCHIVE}" .)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "Packaged $(find dist -type f | wc -l) files into ${ARCHIVE}"

      - name: 🎉 Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ needs.calc-version.outputs.tag }}
          name: ${{ needs.calc-version.outputs.tag }}
          body: ${{ needs.calc-version.outputs.changelog }}
          artifacts: ${{ steps.package.outputs.archive }}
          draft: false
          prerelease: false

  finished-ci:
    name: ✅ CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - calc-version
      - release

    steps:
      - name: 🔍 Check build status
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CALC_RESULT: ${{ needs.calc-version.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          echo "build: $BUILD_RESULT"
          echo "calc-version: $CALC_RESULT"
          echo "release: $RELEASE_RESULT"
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "Build/test failed"
            exit 1
          fi
          # calc-version and release are skipped on non-push events
          for result in "$CALC_RESULT" "$RELEASE_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Version calculation or release failed"
              exit 1
            fi
          done
